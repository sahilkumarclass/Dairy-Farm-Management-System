spring:
  application:
    name: dfms-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dfms}
    username: ${DB_USER:dfms}
    password: ${DB_PASSWORD:dfms}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    jwt:
      # Override in production. Must be at least 32 bytes (256 bits) for HS256.
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
      access-token-ttl: PT1H
      refresh-token-ttl: P7D
      issuer: dfms-api
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.sahilkumar.api: DEBUG
