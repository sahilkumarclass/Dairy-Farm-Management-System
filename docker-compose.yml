services:
  postgres:
    image: postgres:16-alpine
    container_name: dfms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dfms
      POSTGRES_USER: dfms
      POSTGRES_PASSWORD: dfms
    ports:
      - "5432:5432"
    volumes:
      - dfms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfms -d dfms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dfms-pgdata:
